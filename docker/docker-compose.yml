services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phantom
      POSTGRES_PASSWORD: phantom
      POSTGRES_DB: phantommail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantom -d phantommail"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Mosquitto MQTT broker (optional — remove if low on RAM) ──────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    deploy:
      resources:
        limits:
          memory: 64M

  # ── ML sidecar (optional — remove if low on RAM) ─────────────────────────────
  ml-sidecar:
    build:
      context: ../ml-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Phantom Mail app ─────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "25:25"
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://phantom:phantom@postgres:5432/phantommail
      SMTP_ADDR: 0.0.0.0:25
      HTTP_ADDR: 0.0.0.0:8080
      MAIL_DOMAIN: phantom-mail.sanjula.online
      MAILBOX_CLEANUP_INTERVAL_SECS: 60
      WEB_DIR: /app/web
      SMTP_TLS_CERT: /etc/letsencrypt/live/phantom-mail.sanjula.online/fullchain.pem
      SMTP_TLS_KEY: /etc/letsencrypt/live/phantom-mail.sanjula.online/privkey.pem
      # Uncomment when running with --profile full:
      # MQTT_BROKER_URL: mqtt://mosquitto:1883
      # ML_SIDECAR_URL: http://ml-sidecar:9000
    volumes:
      - ../web:/app/web:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
