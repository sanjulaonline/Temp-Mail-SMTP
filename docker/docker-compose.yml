services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phantom
      POSTGRES_PASSWORD: phantom
      POSTGRES_DB: phantommail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantom -d phantommail"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Mosquitto MQTT broker ────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # ── ML sidecar ───────────────────────────────────────────────────────────────
  ml-sidecar:
    build:
      context: ../ml-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"   # ML analysis API
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Phantom Mail app ─────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      ml-sidecar:
        condition: service_healthy
    ports:
      - "25:25"       # SMTP
      - "8080:8080"   # HTTP API
    environment:
      DATABASE_URL: postgres://phantom:phantom@postgres:5432/phantommail
      SMTP_ADDR: 0.0.0.0:25
      HTTP_ADDR: 0.0.0.0:8080
      MAIL_DOMAIN: sanjula.online
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MAILBOX_CLEANUP_INTERVAL_SECS: 60
      WEB_DIR: /app/web
      ML_SIDECAR_URL: http://ml-sidecar:9000
    volumes:
      - ../web:/app/web:ro

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
