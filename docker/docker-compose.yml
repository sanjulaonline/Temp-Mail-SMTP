services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: phantom
      POSTGRES_DB: phantommail
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantom -d phantommail"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Mosquitto MQTT broker (optional — remove if low on RAM) ──────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    deploy:
      resources:
        limits:
          memory: 64M

  # ── ML sidecar (optional — remove if low on RAM) ─────────────────────────────
  ml-sidecar:
    build:
      context: ../ml-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Next.js frontend (optional — needs ~300MB RAM) ───────────────────────────
  web:
    build:
      context: ../web-next
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "3000:3000"
    environment:
      BACKEND_HTTP_BASE_URL: http://app:8080
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 350M

  # ── Phantom Mail app ─────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "25:25"
      - "8080:8080"
    env_file: .env
    environment:
      SMTP_ADDR: 0.0.0.0:25
      HTTP_ADDR: 0.0.0.0:8080
      MAIL_DOMAIN: mail.phantom-mail.sanjula.online
      PHANTOM_WEB_URL: https://phantom-mail.sanjula.online
      ALLOWED_ORIGIN: https://phantom-mail.sanjula.online
      MAILBOX_CLEANUP_INTERVAL_SECS: 60
      WEB_DIR: /app/web
      SMTP_TLS_CERT: /etc/letsencrypt/live/mail.phantom-mail.sanjula.online/fullchain.pem
      SMTP_TLS_KEY: /etc/letsencrypt/live/mail.phantom-mail.sanjula.online/privkey.pem
      DKIM_PRIVATE_KEY_PATH: /etc/dkim/private.pem
      DKIM_SELECTOR: mail
      RUST_LOG: info
      SMTP_RELAY_HOST: smtp.resend.com
      SMTP_RELAY_PORT: 587
      SMTP_RELAY_USERNAME: resend
      # Uncomment when running with --profile full:
      # MQTT_BROKER_URL: mqtt://mosquitto:1883
      # ML_SIDECAR_URL: http://ml-sidecar:9000
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/dkim:/etc/dkim:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
